<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Job Portal</title>

  <style>
    :root{
      --bg1:#0b1020; --bg2:#0f1b33; --panel: rgba(20,26,40,0.75);
      --muted:#9aa6bf; --accent:#6366f1; --accent-2:#06b6d4; --accent-3:#a855f7;
      --glass: rgba(255,255,255,0.04); --radius:14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; min-height:100%;
      background:
        radial-gradient(600px 400px at 10% 10%, rgba(104,109,255,0.10), transparent),
        radial-gradient(500px 350px at 90% 90%, rgba(6,182,212,0.06), transparent),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex; justify-content:center; align-items:center;
      padding:36px; color:#e6eef8;
    }

    .container{ 
      width:100%; max-width:980px; 
      display:grid; grid-template-columns:1fr 460px; 
      gap:28px; padding:28px;
    }

    .card{
      background:var(--panel);
      border-radius:var(--radius);
      padding:28px;
      border:1px solid var(--glass);
      box-shadow:0 8px 40px rgba(0,0,0,0.6);
    }

    .hero{ display:flex; flex-direction:column; gap:16px; }
    .hero h1{ font-size:22px; margin:0; }
    .hero p{ font-size:14px; color:var(--muted); }

    .illustration{
      margin-top:14px;
    }

    .illu-main{
      width:100%;
      background:rgba(255,255,255,0.04);
      border-radius:12px;
      padding:8px;
      border:1px solid rgba(255,255,255,0.08);
      overflow:hidden;
    }
    .illu-main img{
      width:100%;
      height:auto;
      border-radius:10px;
      display:block;
      object-fit:cover;
    }

    .form-wrap{
      background:rgba(255,255,255,0.05);
      padding:22px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.06);
    }
    form{ display:flex; flex-direction:column; gap:14px; }
    label{ font-size:13px; color:var(--muted); }
    .field{ position:relative; }
    input{
      width:100%;
      padding:12px 14px 12px 42px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.02);
      color:white;
      font-size:14px;
    }
    .icon{
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);
      opacity:0.8;
    }
    .btn{
      padding:10px 14px;
      border-radius:10px;
      background:linear-gradient(90deg,var(--accent),var(--accent-3));
      border:0; color:white; cursor:pointer;
      font-weight:600;
      box-shadow:0 6px 20px rgba(99,102,241,0.3);
    }
    .ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,0.14);
      color:var(--muted);
    }
    .oauth{ display:flex; gap:10px; }
    .social-btn{
      flex:1; padding:10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.05);
      display:flex; gap:8px;
      justify-content:center; align-items:center;
      cursor:pointer; color:#eaf2ff; font-weight:700;
    }
    .social-btn img{ width:18px; height:18px; }

    @media(max-width:980px){
      .container{ grid-template-columns:1fr; }
      .illu-main img{ max-width:420px; }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- LEFT HERO -->
  <div class="card hero">
    <h1>📊 Create an account</h1>
    <p>Join Job Portal to get personalized AI-powered job predictions and data-driven career insights.</p>

    <div class="illustration">

      <!-- ONLY ONE MAIN IMAGE (DATA PREDICTION VISUAL) -->
      <div class="illu-main">
        <img src="https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=1200&q=80"
             alt="Data prediction visual">
      </div>

    </div>

    <p style="color:var(--muted); margin-top:10px;">
      Already have an account?
      <a href="/login/" style="color:var(--accent-2)">Login</a>
    </p>
  </div>

  <!-- RIGHT FORM -->
  <div class="card form-wrap">
    <form method="POST">
      {% csrf_token %}

      <div class="field">
        <label for="fullname">Full Name</label>
        <span class="icon">👤</span>
        <input id="fullname" type="text" name="fullname" required placeholder="Your full name">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <span class="icon">🏷️</span>
        <input id="username" type="text" name="username" required placeholder="username123">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <span class="icon">📧</span>
        <input id="email" type="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <span class="icon">📱</span>
        <input id="phone" type="tel" name="phone" required placeholder="+91 98765 43210">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <span class="icon">🔒</span>
        <input id="password" type="password" name="password" required placeholder="Create password">
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <span class="icon">✔️</span>
        <input id="confirm_password" type="password" name="confirm_password" required placeholder="Repeat password">
      </div>

      <div style="display:flex; gap:12px; margin-top:6px;">
        <button class="btn" type="submit">Register</button>
        <button type="button" class="btn ghost" onclick="location.href='/login/'">Already have an account?</button>
      </div>

      <div style="margin-top:12px; color:var(--muted); font-size:14px;">Or sign up with</div>

      <div class="oauth">
        <div class="social-btn">
          <img src="https://www.vectorlogo.zone/logos/google/google-icon.svg"> Google
        </div>
        <div class="social-btn">
          <img src="https://www.vectorlogo.zone/logos/github/github-icon.svg"> GitHub
        </div>
      </div>

    </form>
  </div>

</div>
</body>
</html>
